name: Deploy docs preview

# Runs from the default branch with a write token. It only handles the static
# artifact built by the unprivileged R-CMD-check workflow and never checks out
# or executes PR code.
on:
  workflow_run:
    workflows: [R-CMD-check]
    types: [completed]

permissions: {}

jobs:
  deploy:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: read # download artifact from the triggering run
    concurrency:
      group: gh-pages-deploy
      queue: max
      cancel-in-progress: false
    steps:
      # The deploy action needs a git repository. This checks out the default
      # branch (workflow_run context), never the PR code.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: docs-r
          path: artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The artifact contains a single folder named pr-<number> with the site.
      - name: Validate artifact
        id: pr
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "Missing pull request number"; exit 1; }
          dir="artifact/pr-${PR_NUMBER}"
          [ -d "$dir" ] || { echo "Missing preview directory: $dir"; exit 1; }
          [ -f "$dir/index.html" ] || { echo "Missing index.html"; exit 1; }
          if find "$dir" -type l | grep -q .; then echo "Symlinks not allowed"; exit 1; fi
          rm -rf "$dir/.git" "$dir/.github"
          echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Check PR state
        id: pr-state
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            if (!Number.isSafeInteger(prNumber) || prNumber <= 0) {
              core.setOutput('open', 'false');
              return;
            }
            const {data: pr} = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            core.setOutput('open', String(pr.state === 'open'));

      - name: Deploy PR ${{ steps.pr.outputs.number }} preview 🚀
        if: steps.pr-state.outputs.open == 'true'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: artifact/pr-${{ steps.pr.outputs.number }}
          target-folder: previews/pr-${{ steps.pr.outputs.number }}
          single-commit: true
          clean: true

      - name: Comment PR ${{ steps.pr.outputs.number }} preview link
        if: steps.pr-state.outputs.open == 'true'
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const marker = '<!-- docs-preview-marker -->';
            const url = `https://mlopez-ibanez.github.io/irace/previews/pr-${prNumber}/`;
            const body = `${marker}\n📚 [**Docs preview** for this PR](${url})\n\n`;
            const {owner, repo} = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number: prNumber});
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number: prNumber, body});
            }
