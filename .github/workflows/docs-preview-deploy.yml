name: Deploy docs preview

on:
  workflow_run:
    workflows: [R-CMD-check]
    types: [completed]

permissions: {}

jobs:
  deploy:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: write
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: docs-preview-r
          path: artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate artifact
        id: pr
        env:
          EXPECTED_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          expected="$EXPECTED_PR_NUMBER"
          n=$(head -c 20 artifact/pr-number | tr -d '[:space:]')
          [[ "$expected" =~ ^[0-9]+$ && "$n" == "$expected" ]] || { echo "Invalid PR number"; exit 1; }
          [ -f artifact/site/index.html ] || { echo "Missing index.html"; exit 1; }
          if find artifact/site -type l | grep -q .; then echo "Symlinks not allowed"; exit 1; fi
          rm -rf artifact/site/.git artifact/site/.github
          echo "number=$n" >> "$GITHUB_OUTPUT"

      - name: Deploy PR preview 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: artifact/site
          target-folder: previews/pr-${{ steps.pr.outputs.number }}/r
          branch: gh-pages
          single-commit: true
          clean: true

      - name: Comment PR preview link
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const marker = '<!-- docs-preview-r-marker -->';
            const url = `https://mlopez-ibanez.github.io/irace/previews/pr-${prNumber}/r/`;
            const body = `${marker}\n📚 [**R docs preview** for this PR](${url})\n\n`;
            const {owner, repo} = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number: prNumber});
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number: prNumber, body});
            }
